<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox | A&amp;M Propertiez</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/admin.js" defer></script>
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="/"><img src="/images/logo-640.png" alt="A&amp;M Propertiez" width="640" height="292"></a><button class="btn small" id="logout" type="button" hidden>Sign out</button></div></header>
<main class="wrap ad">
  <form id="login" class="form-shell ad-login">
    <h2>Website inbox</h2><p class="muted">Every form sent from the site, with status and notes. Paste the ADMIN_TOKEN you set in Cloudflare.</p>
    <div class="field"><label for="token">Admin token</label><input id="token" type="password" autocomplete="current-password" required></div>
    <div class="form-foot"><button class="btn primary" type="submit">Open inbox</button></div>
    <div class="form-status" role="status"></div>
  </form>
  <section id="app" hidden>
    <div class="ad-bar">
      <input id="q" type="search" placeholder="Search name, email, address, reference…" aria-label="Search">
      <select id="form" aria-label="Form"><option value="">All forms</option><option value="offer">Offer requests</option><option value="buyer">Buyer list</option><option value="vendor">Contractor sign-ups</option><option value="bid">Contractor quotes</option><option value="contact">Messages</option></select>
      <select id="status" aria-label="Status"><option value="">Any status</option></select>
      <span id="count" class="muted small"></span>
    </div>
    <div class="ad-grid"><ul id="list" class="ad-list" aria-label="Messages"></ul><article id="detail" class="ad-detail"><p class="muted">Pick a message.</p></article></div>
  </section>
</main>
</body>
</html>
